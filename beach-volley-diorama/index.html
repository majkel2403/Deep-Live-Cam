function drawTag(v, rep) {
  if (rep >= 0) {
    if (Math.floor(v * 2.5) % 2 === 0) { octx.fillStyle = '#ffd23a'; for (let i = 0; i < 7; i++) octx.fillRect(60 + i * 5, 110 + i * 5, 5, 70 - i * 10); }
    drawText(octx, 'REPLAY', 120, 110, 10, { align: 'left', c1: '#ffffff', c2: '#ffd23a', out: OUTC, ow: 6 });
    return;
  }
  if (Math.floor(v * 1.6) % 2 === 0) { octx.fillStyle = '#ff2a4a'; octx.fillRect(60, 46, 25, 25); octx.fillStyle = '#ffb0b8'; octx.fillRect(60, 46, 10, 10); }
  drawText(octx, 'LIVE', 100, 46, 4, { align: 'left', c1: '#ffffff', out: OUTC, ow: 4 });
}
function easeOutBounce(x) { const n1 = 7.5625, d1 = 2.75; if (x < 1 / d1) return n1 * x * x; if (x < 2 / d1) return n1 * (x -= 1.5 / d1) * x + 0.75; if (x < 2.5 / d1) return n1 * (x -= 2.25 / d1) * x + 0.9375; return n1 * (x -= 2.625 / d1) * x + 0.984375; }
function drawTitle(v) {
  if (v < 0.5 || v > 7.2) return;
  const exit = ease((v - 6.4) / 0.6), up = exit * 900;
  const p = clamp((v - 0.6) / 0.8, 0, 1), y = 190 - (1 - easeOutBounce(p)) * 520 - up;
  if (v > 1.3 && v < 1.5) { octx.fillStyle = `rgba(255,250,235,${0.35 * (1 - (v - 1.3) / 0.2)})`; octx.fillRect(0, 0, 1920, 1080); }
  band(octx, y - 40, 7 * 22 + 80, '#2a0e3a', 80, ease(clamp((v - 1.2) / 0.3, 0, 1)) * (1 - exit), 0.75);
  drawText(octx, 'BEACH CLASH', 960, y, 22, { c1: '#ffe066', c2: '#ff6a2a', out: OUTC, ow: 16, shadow: 'rgba(10,6,30,0.6)', sd: 22, hi: '#ffffff' });
  const s1 = ease(clamp((v - 1.9) / 0.5, 0, 1)), u = 10, y2 = 470 - up;
  drawText(octx, 'SUNFIRE', 845 - (1 - s1) * 1200, y2, u, { align: 'right', c1: '#ffe066', c2: '#ff5a2a', out: OUTC, ow: 8, shadow: 'rgba(10,6,30,0.5)', sd: 10 });
  if (v > 2.3) drawText(octx, 'VS', 960, y2 - R(Math.max(0, 1 - (v - 2.3) * 6) * 30), u, { c1: '#ffffff', out: OUTC, ow: 8 });
  drawText(octx, 'TIDE', 1075 + (1 - s1) * 1200, y2, u, { align: 'left', c1: '#d8ffff', c2: '#2aa8ff', out: OUTC, ow: 8, shadow: 'rgba(10,6,30,0.5)', sd: 10 });
  if (v > 2.9) { octx.globalAlpha = clamp((v - 2.9) / 0.4, 0, 1) * (1 - exit); drawText(octx, 'PIXEL BEACH VOLLEY CUP', 960, 590 - up, 5, { c1: '#ffffff', out: OUTC, ow: 4 }); octx.globalAlpha = 1; }
  if (v > 4.4 && v < 6.4 && Math.floor(v * 3) % 2 === 0) drawText(octx, '> GET READY <', 960, 700, 7, { c1: '#ffd23a', c2: '#ff8a2a', out: OUTC, ow: 6 });
}
function drawWipe(p, col) { // diamond transition, p: 0 = covered -> 1 = open
  if (p >= 1) return;
  const cell = 120, r = cell * 0.75 * (1 - ease(p));
  octx.fillStyle = col;
  for (let y = 0; y <= 1080 + cell; y += cell / 2) for (let x = ((y / (cell / 2)) % 2) * cell / 2; x <= 1920 + cell; x += cell) {
    octx.beginPath(); octx.moveTo(x, y - r); octx.lineTo(x + r, y); octx.lineTo(x, y + r); octx.lineTo(x - r, y); octx.closePath(); octx.fill();
  }
}

// ===========================================================================
//  Frame
// ===========================================================================
const [vig, vigx] = mk(1920, 1080);
(() => { const gr = vigx.createRadialGradient(960, 560, 380, 960, 560, 1250); gr.addColorStop(0, 'rgba(8,6,30,0)'); gr.addColorStop(1, 'rgba(8,6,30,0.55)'); vigx.fillStyle = gr; vigx.fillRect(0, 0, 1920, 1080); })();

function render(v) {
  v = mod(v, VIDEO_LEN);
  const sh = shotAt(v), w = sh.w, t = mod(v, L);
  AMBT = t;
  const LS = lightAt(w);
  let shx = 0, shy = 0, flash = 0;
  for (const e of BD.events) {
    const a = w - e.t; if (a < 0 || a > 0.6) continue;
    const amp = e.type === 'kill' ? (e.big ? 8 : 6) : e.type === 'super' ? 6 : e.type === 'spike' ? 3.5 : e.type === 'blockhit' ? 5 : 0;
    if (!amp) continue;
    const k = amp * Math.exp(-a * 8);
    shx += Math.sin(a * 97) * k; shy += Math.cos(a * 83) * k * 0.7;
    if ((e.type === 'kill' || e.type === 'super') && a < 0.06) flash = Math.max(flash, 0.22 * (1 - a / 0.06));
  }
  // ---- background + sky (lit by palette)
  gm.setTransform(1, 0, 0, 1, 0, 0); gm.globalAlpha = 1; gm.globalCompositeOperation = 'source-over';
  gm.drawImage(BG[LS.a], 0, 0);
  if (LS.p > 0) { gm.globalAlpha = LS.p; gm.drawImage(BG[LS.b], 0, 0); gm.globalAlpha = 1; }
  gg.setTransform(1, 0, 0, 1, 0, 0); gg.clearRect(0, 0, CW, CH_);
  gm.setTransform(1, 0, 0, 1, M, M); gg.setTransform(1, 0, 0, 1, M, M);
  g = gm;
  drawNightSky(t, LS);
  drawSun(t, LS);
  if (LS.nf > 0.05) { // stadium floodlight pool on the sand
    gm.globalCompositeOperation = 'lighter';
    for (const [rx, ry, al] of [[250, 50, 0.10], [200, 38, 0.10], [150, 28, 0.10]]) { gm.globalAlpha = al * LS.nf; ell(gm, 240, 226, rx, ry, '#8aa0ff'); }
    gm.globalAlpha = 1; gm.globalCompositeOperation = 'source-over';
  }
  drawSea(t, LS);
  // ---- objects (graded)
  gb.setTransform(1, 0, 0, 1, 0, 0); gb.clearRect(0, 0, CW, CH_); gb.setTransform(1, 0, 0, 1, M, M);
  g = gb;
  drawClouds(t); drawGulls(t, LS); drawBoat(t, LS);
  drawStringLights(t, LS, false);
  drawCrowd(t, w);
  drawCraters(w);
  const b = ballAt(w);
  const keys = ['0A', '0B', '1A', '1B'], sts = {};
  for (const k of keys) sts[k] = playerState(k, w);
  for (const k of keys) { const s = sts[k]; drawShadow(s.x + 3, s.G + 1, Math.max(3, 8 - s.jump * 0.08), 0.35 - Math.min(0.2, s.jump * 0.003)); }
  if (b) { const bh = b.G - b.y; drawShadow(b.x + 2 + bh * 0.05, b.G + 1, Math.max(2, 5 - bh * 0.02), clamp(0.4 - bh * 0.003, 0.12, 0.4)); }
  drawNetBack();
  for (const k of keys) drawRunDust(k, w);
  keys.slice().sort((a, c) => sts[a].G - sts[c].G).forEach(k => drawCharacter(k, sts[k], w, LS));
  if (b) {
    const nT = b.fire ? 12 : b.fast ? 7 : 4, fx = TEAM[b.team].fx;
    for (let k = nT; k >= 1; k--) {
      const pb = ballAt(w - k * (b.fire ? 0.012 : b.fast ? 0.018 : 0.03));
      if (!pb || pb.id !== b.id) continue;
      const al = (1 - k / (nT + 1)) * (b.fast ? 0.85 : 0.35);
      if (b.fire) { const fc = ['#fff6b0', '#ffd23a', '#ff8a1a', '#ff3d2e'][Math.min(3, k >> 2)]; g.globalAlpha = al; disc(g, pb.x, pb.y, 4.5 - k * 0.25, fc); gg.globalAlpha = al; disc(gg, pb.x, pb.y, 6 - k * 0.3, '#ff8a1a'); }
      else { g.globalAlpha = al; disc(g, pb.x, pb.y, b.fast ? 3.5 - k * 0.3 : 2.5, b.fast ? fx[k % 3] : '#ffffff'); if (b.fast) { gg.globalAlpha = al; disc(gg, pb.x, pb.y, 5 - k * 0.4, fx[1]); } }
    }
    g.globalAlpha = 1; gg.globalAlpha = 1;
    g.drawImage(BALL[mod(Math.floor(v / VIDEO_LEN * 2880), 8)], R(b.x) - 5, R(b.y) - 5);
    disc(gg, b.x, b.y, b.fire ? 12 : b.fast ? 9 : 4, b.fire ? '#ff8a1a' : b.fast ? fx[1] : '#fff4c8');
  }
  drawNetFront();
  drawPalm(-6, 300, 50, 74, 30, t, 0.4, [195, 228, 262, 296, 330, 4, 160]);
  drawPalm(486, 300, 430, 82, -30, t, 2.1, [200, 236, 268, 300, 338, 14, 170]);
  drawGrass(58, 261, t, 14, 11); drawGrass(110, 262, t, 8, 12); drawGrass(426, 261, t, 14, 13); drawGrass(372, 262, t, 7, 14);
  if (LS.tintA > 0.003) { gb.save(); gb.setTransform(1, 0, 0, 1, 0, 0); gb.globalCompositeOperation = 'source-atop'; gb.globalAlpha = LS.tintA; gb.fillStyle = LS.tint; gb.fillRect(0, 0, CW, CH_); gb.restore(); }
  gm.setTransform(1, 0, 0, 1, 0, 0); gm.drawImage(ob, 0, 0); gm.setTransform(1, 0, 0, 1, M, M);
  g = gm;
  // ---- unlit / emissive
  drawNeonRopes(LS);
  drawStringLights(t, LS, true);
  drawGlowsticks(t, LS);
  for (const e of BD.events) { const a = w - e.t; if (a >= 0 && a < (LIFE[e.type] || 1) && e.type !== 'wave') drawEvent(e, a); }
  drawConfetti(w);
  drawMotes(t, LS);

  // ---- camera & compose
  let cm;
  if (sh.rep >= 0) cm = cameraReplay(w); else cm = cameraLive(w);
  cm = clampCam(cm);
  const Z = cm.Z, vw = 1920 / Z, vh = 1080 / Z;
  const sx = clamp(cm.cx - vw / 2 + shx, -M, W + M - vw - 1), sy = clamp(cm.cy - vh / 2 + shy, -M, H + M - vh - 1);
  const ix = Math.floor(sx), iy = Math.floor(sy), fxo = R((sx - ix) * Z), fyo = R((sy - iy) * Z);
  octx.globalCompositeOperation = 'source-over'; octx.globalAlpha = 1; octx.imageSmoothingEnabled = false;
  octx.drawImage(lo, M + ix, M + iy, vw + 1, vh + 1, -fxo, -fyo, (vw + 1) * Z, (vh + 1) * Z);
  blx.clearRect(0, 0, CW, CH_); blx.filter = 'blur(2px)'; blx.drawImage(gl, 0, 0); blx.filter = 'none';
  bl2x.clearRect(0, 0, CW, CH_); bl2x.filter = 'blur(7px)'; bl2x.drawImage(gl, 0, 0); bl2x.filter = 'none';
  octx.imageSmoothingEnabled = true; octx.globalCompositeOperation = 'lighter';
  octx.globalAlpha = 0.75; octx.drawImage(bl, M + ix, M + iy, vw + 1, vh + 1, -fxo, -fyo, (vw + 1) * Z, (vh + 1) * Z);
  octx.globalAlpha = 0.4; octx.drawImage(bl2, M + ix, M + iy, vw + 1, vh + 1, -fxo, -fyo, (vw + 1) * Z, (vh + 1) * Z);
  octx.globalAlpha = 1; octx.globalCompositeOperation = 'source-over'; octx.imageSmoothingEnabled = false;
  octx.drawImage(vig, 0, 0);
  if (flash > 0) { octx.fillStyle = `rgba(255,250,235,${flash})`; octx.fillRect(0, 0, 1920, 1080); }

  // ---- overlays
  if (sh.rep >= 0) {
    const rp = BD.replays[sh.rep];
    octx.fillStyle = 'rgba(40,60,160,0.10)'; octx.fillRect(0, 0, 1920, 1080);
    octx.fillStyle = 'rgba(0,0,20,0.16)'; for (let y = 0; y < 1080; y += 6) octx.fillRect(0, y, 1920, 2);
    octx.fillStyle = '#05060f'; octx.fillRect(0, 0, 1920, 90); octx.fillRect(0, 990, 1920, 90);
    drawTag(v, sh.rep);
    drawWipe((v - rp.v0) / 0.35, TEAM[rp.team].mid);
    if (rp.v1 - v < 0.3) drawWipe((rp.v1 - v) / 0.3, TEAM[rp.team].mid);
  } else {
    const hudA = clamp((w - 7.4) / 0.4, 0, 1) * clamp((BD.hudEnd - w) / 0.5, 0, 1);
    drawScoreboard(w, hudA);
    if (hudA > 0.5) drawTag(v, -1);
    for (const bn of BD.banners) { const a = w - bn.w; if (a >= 0 && a < bn.dur) drawBanner(bn, a); }
    for (const rp of BD.replays) if (v - rp.v1 >= 0 && v - rp.v1 < 0.35) drawWipe((v - rp.v1) / 0.35, TEAM[rp.team].mid);
    drawTitle(v);
  }
}

window.renderAt = render;
window.VIDEO_LEN = VIDEO_LEN;
window.MATCH_INFO = () => ({ WEND, FINAL_K, rallies: RALLY_T, replays: BD.replays.map(r => [r.v0, r.v1]), score: SCORE });

let paused = false, offset = 0, last = 0;
function frame(now) {
  if (!paused) { last = mod(now / 1000 - offset, VIDEO_LEN); render(last); }
  requestAnimationFrame(frame);
}
if (!CAPTURE) {
  requestAnimationFrame(frame);
  out.addEventListener('click', () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(() => {}); else document.exitFullscreen?.(); });
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); if (paused) offset = performance.now() / 1000 - last; paused = !paused; }
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const d = e.key === 'ArrowRight' ? 5 : -5; last = mod(last + d, VIDEO_LEN); offset = performance.now() / 1000 - last; if (paused) render(last); }
    if (e.key === 'f') out.click();
  });
  setTimeout(() => { document.getElementById('hint').style.opacity = 0; }, 4000);
} else render(0);
</script>
