<title>Sunfire vs Tide</title>
<style>
/* Single-look, dark stage: the canvas is the whole page. Palette lives in the JS (P = pixel palette). */
:root { --stage: #05060f; --hint: #8fb4ff; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--stage); margin: 0; overflow: hidden; display: grid; place-items: center; }
#stage { display: block; width: min(100vw, calc(100vh * 16 / 9)); max-width: 100%; aspect-ratio: 16 / 9; image-rendering: pixelated; cursor: pointer; }
#hint { position: fixed; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); font: 600 11px/1.2 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--hint); opacity: .55; pointer-events: none; transition: opacity .6s; }
.cap #hint { display: none; }
</style>
<canvas id="stage" width="1920" height="1080" aria-label="Animated pixel-art beach volleyball match, looping"></canvas>
<div id="hint">Click: fullscreen · Space: pause</div>
<script>
'use strict';
// ---------------------------------------------------------------------------
//  World: 480x270 pixel canvas; the camera shows a 384x216 window at exactly 5x.
//  Every frame is a pure function of t in [0, L) so the loop is seamless.
// ---------------------------------------------------------------------------
const W = 480, H = 270, L = 6, M = 8;                   // M = margin for screen shake
const VIEW = { x: 48, y: 44, w: 384, h: 216 };            // camera: 384x216 crop, upscaled exactly 5x to 1920x1080
const TAU = Math.PI * 2;
const CAPTURE = /capture/.test(location.search);
if (CAPTURE) document.documentElement.classList.add('cap');

const out = document.getElementById('stage');
const octx = out.getContext('2d');
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return [c, x]; }
const CW = W + 2 * M, CH_ = H + 2 * M;
const [lo, g]   = mk(CW, CH_);   // main pixel layer
const [gl, gg]  = mk(CW, CH_);   // emissive layer (feeds the bloom)
const [bl, blx] = mk(CW, CH_);   // blurred bloom
const [bl2, bl2x] = mk(CW, CH_);
const [bgc, bgx] = mk(CW, CH_);  // static background
const SEA_Y0 = 118, SEA_H = 50;
const [sea, seax] = mk(CW, SEA_H);
const seaImg = seax.createImageData(CW, SEA_H);

const mod = (a, b) => ((a % b) + b) % b;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, p) => a + (b - a) * p;
const ease = p => { p = clamp(p, 0, 1); return p * p * (3 - 2 * p); };
const R = Math.round;
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function h2(x, y) { return hash(x * 12.9898 + y * 78.233); }
function rng(seed) { let s = (seed * 2654435761) >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function toHex(r, g2, b) { return '#' + [r, g2, b].map(v => clamp(R(v), 0, 255).toString(16).padStart(2, '0')).join(''); }
function shade(c, k) { const [r, g2, b] = hex(c); return toHex(r * k, g2 * k, b * k); }
function mix(a, b, p) { const A = hex(a), B = hex(b); return toHex(lerp(A[0], B[0], p), lerp(A[1], B[1], p), lerp(A[2], B[2], p)); }
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);
const bay = (x, y) => BAYER[(mod(y, 4)) * 4 + mod(x, 4)];

function rect(c, x, y, w, h, col) { c.fillStyle = col; c.fillRect(R(x), R(y), w, h); }
function tline(c, x0, y0, x1, y1, w, col) {
  c.fillStyle = col;
  const dx = x1 - x0, dy = y1 - y0, n = Math.max(1, Math.ceil(Math.max(Math.abs(dx), Math.abs(dy))));
  const o = Math.floor(w / 2);
  for (let i = 0; i <= n; i++) { const p = i / n; c.fillRect(R(x0 + dx * p) - o, R(y0 + dy * p) - o, w, w); }
}
function disc(c, cx, cy, r, col) {
  c.fillStyle = col;
  for (let y = -Math.ceil(r); y <= Math.ceil(r); y++) {
    const hw = Math.sqrt(Math.max(0, r * r - y * y));
    if (hw <= 0 && y !== 0) continue;
    c.fillRect(R(cx - hw), R(cy + y), Math.max(1, R(hw * 2)), 1);
  }
}
function ell(c, cx, cy, rx, ry, col) {
  c.fillStyle = col;
  for (let y = -Math.ceil(ry); y <= Math.ceil(ry); y++) {
    const hw = rx * Math.sqrt(Math.max(0, 1 - (y * y) / (ry * ry)));
    if (hw < 0.5) continue;
    c.fillRect(R(cx - hw), R(cy + y), R(hw * 2), 1);
  }
}

// ---------------------------------------------------------------------------
//  Palette: warm sun / sand / Sunfire team against cool sky / sea / Tide team
// ---------------------------------------------------------------------------
const P = {
  out: '#160c2c',
  sky: ['#101654', '#16237a', '#1d36a0', '#2650c4', '#3471dc', '#4c95ea', '#7ab8f4', '#aedaff', '#e4f4ff'],
  sunCore: '#fffbe8', sun: '#ffe58a', sunRim: '#ffbf3c',
  warm: '#ffd77a',
  sand: ['#e7cd9b', '#f4e1b8', '#fbefd2', '#fff9ec'],
  speck: '#e2c08a', speck2: '#c99c62',
  rope: '#2563e8', ropeHi: '#a8dcff',
};
const SUN = { x: 150, y: 74 };
const GROUND_A = 240;
const groundB = x => 230 - (x - 252) * 16 / 53;   // setter/blocker moves diagonally: net (230) -> set spot (214)

// ---------------------------------------------------------------------------
//  Static background (sky, distant land, sand, court ropes)
// ---------------------------------------------------------------------------
function buildBackground() {
  const img = bgx.createImageData(CW, CH_);
  const d = img.data;
  const skyRGB = P.sky.map(hex);
  const warm = hex('#ffe9b0');
  const sandRGB = P.sand.map(hex);
  for (let yy = 0; yy < CH_; yy++) {
    const y = yy - M;
    for (let xx = 0; xx < CW; xx++) {
      const x = xx - M, i = (yy * CW + xx) * 4;
      let c;
      const th = bay(x, y);
      if (y < SEA_Y0) {
        const v = clamp((y + 8) / (SEA_Y0 + 8), 0, 1);
        const f = Math.pow(v, 1.15) * (skyRGB.length - 1);
        const k = Math.floor(f), fr = f - k;
        c = skyRGB[Math.min(skyRGB.length - 1, k + (fr > 0.5 + (th - 0.5) * 0.25 ? 1 : 0))].slice();
        // warm sunlight halo, posterised with dither
        const dist = Math.hypot((x - SUN.x) * 0.85, y - SUN.y);
        let w = clamp(1 - dist / 120, 0, 1); w = w * w * 0.5;
        const q = Math.floor(w * 4 + 0.5 + (th - 0.5) * 0.25) / 4;
        c = c.map((ch, j) => lerp(ch, warm[j], q));
        // horizon haze band
        if (y > SEA_Y0 - 7) { const hz = (y - (SEA_Y0 - 7)) / 7; if (hz > th) c = c.map((ch, j) => lerp(ch, warm[j], 0.35)); }
      } else {
        // sand: darker far, brightest mid-court, warmer foreground lip
        let f;
        if (y < 200) f = lerp(0.6, 3, clamp((y - 160) / 40, 0, 1));
        else if (y < 258) f = 3;
        else f = lerp(3, 1.2, clamp((y - 258) / 12, 0, 1));
        const k = Math.floor(f), fr = f - k;
        c = sandRGB[Math.min(3, k + (fr > th ? 1 : 0))].slice();
        const hh = h2(x, y);
        const rip = Math.sin(x * 0.21 + y * 1.7 + Math.sin(x * 0.043 + y * 0.2) * 3);
        if (rip > 0.94 && y > 168) c = hex('#f0dcb0');
        if (hh < 0.035) c = hex(P.speck);
        else if (hh < 0.042) c = hex(P.speck2);
        else if (hh > 0.994) c = [255, 255, 255];
      }
      d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
    }
  }
  bgx.putImageData(img, 0, 0);
  bgx.setTransform(1, 0, 0, 1, M, M);
  // distant headland (left) and island (right) in hazy blue
  for (let x = -M; x < 90; x++) {
    const hgt = R(9 * Math.exp(-Math.pow((x - 12) / 34, 2)) + 3 * Math.exp(-Math.pow((x - 52) / 14, 2)));
    if (hgt > 0) { rect(bgx, x, SEA_Y0 - hgt, 1, hgt, '#5f97de'); rect(bgx, x, SEA_Y0 - hgt, 1, 1, '#8fc0f2'); }
  }
  for (let x = 330; x < 410; x++) {
    const hgt = R(7 * Math.exp(-Math.pow((x - 368) / 22, 2)));
    if (hgt > 0) { rect(bgx, x, SEA_Y0 - hgt, 1, hgt, '#5a91da'); rect(bgx, x, SEA_Y0 - hgt, 1, 1, '#88baf0'); }
  }
  // tiny island palms
  [[356, 6], [372, 7], [384, 5]].forEach(([x, h]) => {
    tline(bgx, x, SEA_Y0 - 5, x + 1, SEA_Y0 - 5 - h, 1, '#4d84d0');
    [[-3, 1], [3, 1], [-2, -1], [2, -1]].forEach(([dx, dy]) => tline(bgx, x + 1, SEA_Y0 - 5 - h, x + 1 + dx, SEA_Y0 - 5 - h + dy + 1, 1, '#4d84d0'));
  });
  // court ropes (diorama 3/4 perspective)
  const ropes = [[52, 206, 428, 206], [22, 252, 458, 252], [52, 206, 22, 252], [428, 206, 458, 252]];
  ropes.forEach(([x0, y0, x1, y1]) => {
    tline(bgx, x0, y0 + 1, x1, y1 + 1, 1, '#d8bd8c');
    tline(bgx, x0, y0, x1, y1, 1, P.rope);
  });
  rect(bgx, 52, 205, 377, 1, P.ropeHi); rect(bgx, 22, 251, 437, 1, P.ropeHi);
  // centre line beneath net
  tline(bgx, 252, 206, 230, 252, 1, '#e0c592');
  bgx.setTransform(1, 0, 0, 1, 0, 0);
}

// ---------------------------------------------------------------------------
//  Clouds (pre-rendered pixel sprites)
// ---------------------------------------------------------------------------
function makeCloud(blobs, w, h) {
  const [c, x] = mk(w, h);
  const im = x.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let xx = 0; xx < w; xx++) {
    let inside = false, top = 1e9;
    for (const [bx, by, r] of blobs) {
      const dd = Math.hypot(xx - bx, (y - by) * 1.15);
      if (dd <= r) { inside = true; top = Math.min(top, (y - (by - r / 1.15)) / (r * 1.6)); }
    }
    if (!inside) continue;
    const yy = y / h;
    let col = yy > 0.72 ? '#9cc0ef' : yy > 0.55 ? '#cfe5ff' : '#ffffff';
    if (yy > 0.6 && yy <= 0.72 && bay(xx, y) > 0.5) col = '#b5d3f7';
    if (top < 0.12 && xx < w * 0.55) col = '#fff3cf';
    const i = (y * w + xx) * 4, cc = hex(col);
    im.data[i] = cc[0]; im.data[i + 1] = cc[1]; im.data[i + 2] = cc[2]; im.data[i + 3] = 255;
  }
  x.putImageData(im, 0, 0);
  return c;
}
const CLOUDS = [
  { c: makeCloud([[10, 12, 8], [22, 8, 10], [36, 11, 9], [48, 14, 6], [28, 15, 7]], 58, 22), x: 196, y: 48, a: 3 },
  { c: makeCloud([[8, 9, 6], [18, 6, 8], [30, 8, 7], [40, 11, 5]], 48, 16), x: 296, y: 58, a: 2 },
  { c: makeCloud([[8, 8, 6], [20, 5, 8], [33, 7, 8], [46, 9, 6], [58, 10, 5]], 66, 16), x: 368, y: 46, a: 2.5 },
  { c: makeCloud([[6, 6, 4], [14, 4, 6], [24, 6, 5]], 32, 11), x: 262, y: 92, a: 1.5 },
  { c: makeCloud([[6, 5, 4], [14, 4, 5], [22, 5, 4]], 28, 9), x: 64, y: 100, a: 1 },
];

// ---------------------------------------------------------------------------
//  Ball sprites (8 spin frames)
// ---------------------------------------------------------------------------
const BALL = [];
for (let f = 0; f < 8; f++) {
  const [c, x] = mk(11, 11);
  const cols = [['#ffffff', '#d5dcf0'], ['#ffd23a', '#d99418'], ['#2f7bff', '#1c4dbb']];
  for (let dy = -5; dy <= 5; dy++) for (let dx = -5; dx <= 5; dx++) {
    const d2 = dx * dx + dy * dy;
    if (d2 > 27) continue;
    let col;
    if (d2 > 18) col = P.out;
    else {
      const rr = Math.sqrt(d2) / 4.3;
      const a = Math.atan2(dy, dx) + f * TAU / 24 + rr * 1.6;
      const sec = mod(Math.floor(a / (TAU / 3)), 3);
      col = cols[sec][(dx + dy > 2) ? 1 : 0];
      if (dx === -2 && dy === -2) col = '#ffffff';
      if (dx === -1 && dy === -3) col = '#ffffff';
    }
    rect(x, dx + 5, dy + 5, 1, 1, col);
  }
  BALL.push(c);
}

// ---------------------------------------------------------------------------
//  Characters: four original chibi athletes, skeleton-posed each frame
// ---------------------------------------------------------------------------
const CHARS = {
  '0A': { name: 'Blaze', hair: 'spiky', hairC: '#ff3b2f', hairD: '#9e1430', hairH: '#ffa04a', skin: '#f6bd92', jersey: '#ff4d2e', trim: '#ffd23a', shorts: '#ffd23a', acc: '#ffffff', glow: '#ffb02e' },
  '0B': { name: 'Mira',  hair: 'ponytail', hairC: '#ff4fa8', hairD: '#9c1f6a', hairH: '#ffb0dc', skin: '#c98a5e', jersey: '#ff4d2e', trim: '#ffd23a', shorts: '#ffd23a', acc: '#ffffff', glow: '#ff7a3c' },
  '1A': { name: 'Kai',   hair: 'afro', hairC: '#3b2519', hairD: '#1c100a', hairH: '#6a4430', skin: '#7c4a30', jersey: '#16c9d6', trim: '#ffffff', shorts: '#1d3fa8', acc: '#7ff4ff', glow: '#3ae0ff' },
  '1B': { name: 'Nori',  hair: 'cap', hairC: '#ffd84a', hairD: '#c08a22', hairH: '#fff1a0', cap: '#1d3fa8', skin: '#ffd6b6', jersey: '#16c9d6', trim: '#ffffff', shorts: '#1d3fa8', acc: '#7ff4ff', glow: '#5aa8ff' },
};
for (const k in CHARS) { const c = CHARS[k]; c.skinD = shade(c.skin, 0.78); c.jerseyD = shade(c.jersey, 0.72); c.shortsD = shade(c.shorts, 0.78); }

// pose space: x forward, y up; hip at (0, hy); arms relative to shoulder, legs to hip
const PO = {
  ready:     { hy: 10, n: [2, 11], aF: [3, -5, 6, -3],  aB: [0, -5, 3, -4],   lF: [3, -5, 4, -10],  lB: [-3, -5, -4, -10] },
  blockReady:{ hy: 10, n: [1, 11], aF: [2, 3, 3, 7],    aB: [1, 3, 2, 7],     lF: [2, -5, 2, -10],  lB: [-2, -5, -3, -10] },
  digready:  { hy: 8,  n: [4, 10], aF: [4, -4, 7, -6],  aB: [3, -4, 6, -6],   lF: [5, -3, 6, -8],   lB: [-4, -4, -6, -8] },
  dig:       { hy: 6,  n: [5, 9],  aF: [4, -5, 9, -7],  aB: [3, -5, 8, -7],   lF: [6, -1, 7, -6],   lB: [-4, -3, -7, -6] },
  set:       { hy: 11, n: [0, 12], aF: [4, 5, 5, 12],   aB: [2, 5, 3, 12],     lF: [2, -6, 3, -11],  lB: [-2, -6, -3, -11] },
  setfollow: { hy: 11, n: [1, 12], aF: [4, 7, 7, 14],   aB: [3, 7, 6, 14],    lF: [2, -6, 3, -11],  lB: [-2, -6, -3, -11] },
  load:      { hy: 7,  n: [3, 10], aF: [-4, -4, -7, -2],aB: [-5, -4, -8, -1], lF: [5, -3, 3, -7],   lB: [1, -4, -2, -7] },
  wind:      { hy: 10, n: [-1, 12],aF: [-4, 4, -5, 8],  aB: [3, 6, 5, 11],    lF: [3, -5, -1, -9],  lB: [-2, -4, -6, -7] },
  hit:       { hy: 10, n: [3, 11], aF: [3, 7, 8, 13],   aB: [2, -3, 0, -7],   lF: [3, -6, 2, -10],  lB: [-2, -5, -4, -9] },
  follow:    { hy: 10, n: [4, 10], aF: [5, -1, 6, -6],  aB: [-2, -4, -5, -6], lF: [4, -4, 2, -9],   lB: [-1, -6, -3, -10] },
  block:     { hy: 11, n: [1, 12], aF: [2, 8, 3, 16],   aB: [1, 8, 2, 16],    lF: [1, -6, 1, -11],  lB: [-1, -6, -2, -11] },
  land:      { hy: 7,  n: [4, 9],  aF: [4, -3, 8, -2],  aB: [-3, -3, -6, -2], lF: [5, -3, 5, -7],   lB: [-3, -3, -5, -7] },
  cheer:     { hy: 10, n: [1, 11], aF: [3, 5, 5, 10],   aB: [-2, 5, -3, 10],  lF: [3, -5, 4, -10],  lB: [-3, -5, -4, -10] },
};
function runPose(ph, lean = 3) {
  const s = Math.sin(ph), c = Math.cos(ph);
  const hy = 9.6 + Math.abs(c) * 0.9;
  const leg = (ss, cc) => { const fx = 5 * ss, fy = -hy + Math.max(0, cc) * 3.5; return [fx * 0.5 + 2, fy * 0.5 - 0.5, fx, fy]; };
  return { hy, n: [lean, 10.5], aF: [-3 * s, -4, -3 * s + 3, -2], aB: [3 * s, -4, 3 * s + 3, -2], lF: leg(s, c), lB: leg(-s, -c) };
}
function lp(a, b, p) {
  p = clamp(p, 0, 1);
  const o = { hy: lerp(a.hy, b.hy, p) };
  for (const k of ['n', 'aF', 'aB', 'lF', 'lB']) o[k] = a[k].map((v, i) => lerp(v, b[k][i], p));
  return o;
}

// Rally choreography (right-team coordinates, facing left). Left team = mirror, offset by L/2.
const JA = 50, JB = 20;
const RUN_A = TAU * 3.2, RUN_BACK = TAU * 2.4, RUN_B = TAU * 3, SHUF_B = TAU * 2.6;
function stateA(tau) {
  let x = 414, pose = PO.ready, jump = 0, shout = 0, aura = 0, running = false;
  if (tau < 0.5) { pose = lp(PO.digready, PO.dig, ease((tau - 0.3) / 0.2)); shout = tau > 0.4 ? 1 : 0; }
  else if (tau < 0.8) { pose = lp(PO.dig, runPose(0), ease((tau - 0.6) / 0.2)); shout = tau < 0.66 ? 1 : 0; }
  else if (tau < 2.35) { x = lerp(414, 298, ease((tau - 0.8) / 1.55)); pose = runPose((tau - 0.8) * RUN_A); running = true; }
  else if (tau < 2.55) { const p = (tau - 2.35) / 0.2; x = lerp(298, 294, p); pose = lp(runPose(1.55 * RUN_A), PO.load, ease(p * 1.6)); }
  else if (tau < 3.45) {
    const s = (tau - 3) / 0.45; jump = JA * (1 - s * s);
    x = tau < 3 ? lerp(295, 281, (tau - 2.55) / 0.45) : lerp(281, 273, (tau - 3) / 0.45);
    if (tau < 2.68) pose = lp(PO.load, PO.wind, (tau - 2.55) / 0.13);
    else if (tau < 2.9) pose = PO.wind;
    else if (tau < 3.0) pose = lp(PO.wind, PO.hit, (tau - 2.9) / 0.1);
    else if (tau < 3.1) pose = lp(PO.hit, PO.follow, (tau - 3) / 0.1);
    else pose = lp(PO.follow, PO.land, (tau - 3.3) / 0.15);
    aura = clamp(1 - Math.abs(tau - 2.95) / 0.35, 0, 1);
    shout = tau > 2.85 && tau < 3.3 ? 1 : 0;
  }
  else if (tau < 3.75) { x = 272; pose = lp(PO.land, PO.ready, ease((tau - 3.5) / 0.25)); }
  else if (tau < 5.5) {
    x = lerp(272, 414, ease((tau - 3.75) / 1.75));
    pose = lp(lp(PO.ready, runPose(-(tau - 3.75) * RUN_BACK, 1), ease((tau - 3.75) / 0.2)), PO.ready, ease((tau - 5.3) / 0.2));
    running = tau < 5.35;
  }
  else pose = lp(PO.ready, PO.digready, ease((tau - 5.5) / 0.4));
  return { x, pose, jump, shout, aura, running, G: GROUND_A, f: -1 };
}
function stateB(tau) {
  let x = 305, pose = PO.ready, jump = 0, shout = 0, aura = 0, running = false;
  const tb = tau >= 5.6 ? tau - 6 : tau;
  if (tb >= -0.4 && tb < 0.6) {
    x = 252;
    if (tb < -0.25) pose = lp(PO.blockReady, PO.load, ease((tb + 0.4) / 0.15));
    else if (tb < 0.41) {
      const s = (tb - 0.08) / 0.33; jump = Math.max(0, JB * (1 - s * s));
      pose = tb < -0.15 ? lp(PO.load, PO.block, ease((tb + 0.25) / 0.1)) : tb > 0.33 ? lp(PO.block, PO.land, (tb - 0.33) / 0.08) : PO.block;
      shout = tb > -0.1 && tb < 0.25 ? 1 : 0;
    }
    else pose = lp(PO.land, PO.ready, ease((tb - 0.41) / 0.19));
  }
  else if (tau < 1.3) {
    x = lerp(252, 305, ease((tau - 0.6) / 0.7));
    pose = lp(lp(PO.ready, runPose(-(tau - 0.6) * RUN_B, 1), ease((tau - 0.6) / 0.12)), PO.ready, ease((tau - 1.18) / 0.12));
    running = tau < 1.2;
  }
  else if (tau < 1.6) pose = lp(PO.ready, PO.set, ease((tau - 1.3) / 0.22));
  else if (tau < 1.9) pose = lp(PO.set, PO.setfollow, ease((tau - 1.6) / 0.12));
  else if (tau < 2.3) pose = lp(PO.setfollow, PO.ready, ease((tau - 1.9) / 0.3));
  else if (tau < 3.5) {
    // watches the spike, then a little fist-pump hop
    const hop = tau > 3.05 && tau < 3.35 ? Math.sin((tau - 3.05) / 0.3 * Math.PI) : 0;
    jump = hop * 6; pose = lp(PO.ready, PO.cheer, hop);
  }

        else if (h2(x + k8 * 13, yy + k8 * 5) > 0.997) { c = [255, 255, 255]; glit.push(x, y); }

  seax.putImageData(seaImg, 0, 0);
  g.drawImage(sea, -M, SEA_Y0);

}
function drawBoat(t) {

  rect(g, x - 5, y, 11, 1, '#f5f5ff'); rect(g, x - 4, y + 1, 9, 1, '#c33a4a');

const CROWD = (() => {
  const r = rng(7), list = [];
  const shirts0 = ['#ff4d2e', '#ff8a2a', '#ffd23a', '#ff5fa8'], shirts1 = ['#16c9d6', '#2f7bff', '#7ff4ff', '#8a6bff'];
  const skins = ['#f6bd92', '#c98a5e', '#7c4a30', '#ffd6b6', '#a8683f'], hairs = ['#2a1810', '#ffd84a', '#ff3b2f', '#3a2a6a', '#111111', '#8a5a2a'];
  for (const row of [168, 176]) {

      list.push({ x, y: row, team, shirt: (team ? shirts1 : shirts0)[R(r() * 3)], skin: skins[R(r() * 4)], hair: hairs[R(r() * 5)], ph: r(), big: r() < 0.25 });
    }

})();
function excitement(team, tw) {
  let e = 0;
  for (const ev of EVENTS) {
    const a = mod(tw - ev.t, L);
    if (ev.type === 'spike') e = Math.max(e, (ev.team === team ? 1 : 0.35) * Math.exp(-a * 1.1));
    if (ev.type === 'dig' && ev.team === team) e = Math.max(e, 0.6 * Math.exp(-a * 2));
  }

}
function drawUmbrella(x, y, c1, c2, t, i) {
  rect(g, x, y - 18, 1, 18, '#efe6da');

    const hw = R(3 + row * 2.2);

  }

}
function drawCrowd(t, tw) {

function drawNetBack() {

  rect(g, 251, 144, 3, 62, '#e8edf6'); rect(g, 253, 144, 1, 62, '#9aa7c8');
  ell(g, 254, 206, 4, 1, 'rgba(60,80,160,0.35)');

  for (let i = 0; i <= 22; i++) { const p = i / 22, a = top(p), b = bot(p); tline(g, a[0], a[1], b[0], b[1], 1, '#122050'); }
  for (let j = 1; j < 8; j++) { const q = j / 8; tline(g, 252, lerp(147, 172, q), 230, lerp(182, 214, q), 1, '#122050'); }
  g.globalAlpha = 1;
  tline(g, 252, 172, 230, 214, 1, '#f4f6ff');

function drawNetFront() {

function drawPalm(rootX, rootY, topX, topY, bend, t, seed, dirs) {
  const ph = t / L;
  const sway = Math.sin(TAU * ph + seed) * 2 + Math.sin(TAU * 2 * ph + seed * 2) * 0.7;
  const cx = topX + sway, cy = topY + Math.abs(sway) * 0.3;
  const kx = (rootX + cx) / 2 + bend, ky = (rootY + cy) / 2;
  const N = 60;
  for (let i = 0; i <= N; i++) {
    const p = i / N, q = 1 - p;
    const x = q * q * rootX + 2 * q * p * kx + p * p * cx, y = q * q * rootY + 2 * q * p * ky + p * p * cy;
    const w = R(lerp(9, 4, p));
    const band = Math.floor(i / 3) % 2;
    rect(g, x - w / 2, y, w, 2, band ? '#8a5634' : '#704226');
    rect(g, x - w / 2, y, 1, 2, P.out);
    rect(g, x - w / 2 + 1, y, 1, 2, '#c8905a');

  }

  // fronds
  dirs.forEach((deg, k) => {
    const ang = deg * Math.PI / 180 + 0.07 * Math.sin(TAU * 2 * ph + k * 1.3 + seed);
    const len = 30 + (k % 3) * 4;
    let lx = cx, ly = cy;
    for (let s = 0; s <= len; s++) {
      const u = s / len;
      const x = cx + Math.cos(ang) * s, y = cy + Math.sin(ang) * s + 18 * u * u + Math.sin(TAU * ph * 2 + k + u * 3) * u * 1.5;
      const lit = Math.cos(ang) < 0.2;

        const ll = R(6 * (1 - u) + 2);
        for (const sd of [-1, 1]) {
          const la = ang + sd * 1.15 + 0.5;
          tline(g, x, y, x + Math.cos(la) * ll, y + Math.sin(la) * ll + 2, 1, sd < 0 && lit ? '#5fd06a' : (sd < 0 ? '#2fa858' : '#1a7a44'));

}
function drawGrass(x0, y0, t, n, seed) {

const MOTES = Array.from({ length: 34 }, (_, i) => { const r = rng(300 + i); return { x: r() * W, o: r(), k: 1 + R(r() * 2), warm: r() < 0.55, s: r() }; });

// ---------------------------------------------------------------------------

const [vig, vigx] = mk(1920, 1080);

// ---------------------------------------------------------------------------
//  Frame

const TW_A = 0.45, OM = TAU / (L / 2);
const gameTime = t => mod(t - (TW_A / OM) * Math.sin(OM * t), L);   // slow-mo at each spike, faster mid-rally; same loop length

function render(t) {
  t = mod(t, L);

  // screen shake from spikes

  drawGulls(t);
  drawSea(t);
  drawBoat(t);

  // players + ball shadows

  drawShadow(b.x + 2 + bh * 0.05, bg2 + 1, Math.max(2, 5 - bh * 0.02), clamp(0.4 - bh * 0.003, 0.12, 0.4));

  for (const team of [0, 1]) for (const role of ['B', 'A']) drawRunDust(team, role, tw);

  // ball trail + ball

// realtime playback
let paused = false, offset = 0, last = 0;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(now) {
  if (!paused) { last = now / 1000 - offset; render(last); }
  requestAnimationFrame(frame);
}
if (!CAPTURE) {
  if (reduce) { paused = true; render(2.97); document.getElementById('hint').textContent = 'Reduced motion: Space to play'; }
