<script>
if(location.search.includes('render'))document.body.classList.add('render');
const NS='http://www.w3.org/2000/svg', E=Engine, S=window.SCRIPT, L=window.LABELS;
const INK='#1d2b26', RED='#d83a30', GRN='#2f8a45', MOSS='#6bbf59', GOLD='#f0a500', GOLDF='#ffc94d', BARK='#7a4e2d', SKIN='#ffdcb8', BLUE='#3b6ea5';
const $=(id)=>document.getElementById(id);
const el=(n,a={},p=null)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};

/* ---------- geometry helpers (absolute path commands only) ---------- */
function tr(d,sx,sy,tx,ty){let i=0;return d.replace(/([MLCQZ])|(-?\d*\.?\d+)/g,(m,c,n)=>{if(c){i=0;return c;}const v=parseFloat(n);const r=(i%2===0)?(v*sx+tx):(v*sy+ty);i++;return r.toFixed(1);});}
function sm(pts,close){let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;d+=` Q${pts[i][0].toFixed(1)},${pts[i][1].toFixed(1)} ${mx.toFixed(1)},${my.toFixed(1)}`;}
 const l=pts[pts.length-1];d+=` L${l[0].toFixed(1)},${l[1].toFixed(1)}`;return d;}
function ell(cx,cy,rx,ry,a0,a1,n=36){const p=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;p.push([cx+rx*Math.cos(a),cy+ry*Math.sin(a)]);}return sm(p);}
const PI=Math.PI;
function wob(x0,y0,x1,y1,amp=3,n=8,seed=1){const p=[];for(let i=0;i<=n;i++){const k=i/n;p.push([x0+(x1-x0)*k,y0+(y1-y0)*k+(E.rnd(seed*13+i)-.5)*amp*2]);}return sm(p);}
const T=(items,sx,sy,tx,ty)=>items.map(o=>({...o,d:tr(o.d,sx,sy,tx,ty)}));
const st=(d,c=INK,w=7)=>({d,c,w});

/* ---------- handwriting (Hershey single-stroke) ---------- */
function lab(key,x,y,size,c=INK,anchor='c',w){const l=L[key],s=size/21,W=l.w*s;const x0=anchor==='c'?x-W/2:(anchor==='r'?x-W:x);
 return l.strokes.map(d=>({d:tr(d,s,s,x0,y-22*s),c,w:w||Math.max(4.5,Math.min(8,size*0.095))}));}
const labW=(key,size)=>L[key].w*size/21;

/* ---------- art library (local coords) ---------- */
function elfLocal(o){ // feet at (0,0), ~318 high
 const tunic=o.tunic||GRN, tdark=o.tdark||'#2c7a45', strokes=[], fills=[];
 const cap='M-56,-205 C-52,-255 -18,-292 30,-320 C28,-286 56,-262 58,-205';
 strokes.push(st(cap,RED,7), st('M30,-320 C52,-330 72,-318 76,-298',RED,6), st('M-64,-204 C-30,-188 30,-188 64,-204',RED,7), st('M38,-236 C60,-262 96,-262 112,-240 C96,-214 60,-216 38,-236 Z M38,-236 L112,-240',GOLD,5));
 const face='M-52,-205 C-54,-150 -30,-132 0,-132 C30,-132 54,-150 52,-205';
 strokes.push(st(face,INK,7), st('M-52,-190 L-86,-208 L-50,-166',INK,6), st('M52,-190 L86,-208 L50,-166',INK,6),
  st('M-22,-176 L-22,-166',INK,9), st('M22,-176 L22,-166',INK,9), st('M-14,-150 C-5,-141 5,-141 14,-150',INK,6), st('M-42,-158 L-30,-158 M30,-158 L42,-158',"#ff7f7f",6));
 const body='M-30,-134 C-62,-110 -62,-60 -52,-24 L52,-24 C62,-60 62,-110 30,-134';
 strokes.push(st(body,tdark,7), st('M-57,-64 L57,-64',BARK,8), st('M-10,-74 L10,-74 L10,-54 L-10,-54 Z',GOLD,5));
 if(o.wave) strokes.push(st('M-54,-112 C-84,-96 -88,-76 -74,-52',tdark,7), st('M54,-112 C92,-136 104,-170 98,-206 M98,-206 L84,-224 M98,-206 L100,-228 M98,-206 L114,-222',tdark,7));
 else strokes.push(st('M-54,-112 C-84,-96 -88,-76 -74,-52',tdark,7), st('M54,-112 C84,-96 88,-76 74,-52',tdark,7));
 strokes.push(st('M-26,-24 L-26,-6 M26,-24 L26,-6',BARK,7), st('M-48,0 C-48,-14 -30,-16 -14,-8 L-12,0 Z',BARK,6), st('M48,0 C48,-14 30,-16 14,-8 L12,0 Z',BARK,6));
 fills.push({d:face+' L-52,-205 Z',c:SKIN}, {d:body+' Z',c:o.tunicF||'#7fcf7a'}, {d:'M-48,0 C-48,-14 -30,-16 -14,-8 L-12,0 Z M48,0 C48,-14 30,-16 14,-8 L12,0 Z',c:'#b9835a'},
  {d:cap+' C20,-190 -20,-190 -56,-205 Z',c:'#ee5a4f'}, {d:'M-57,-70 L57,-70 L57,-58 L-57,-58 Z',c:'#b9835a'});
 return {strokes,fills};
}
function elf(x,y,s,o={}){const e=elfLocal(o);return {strokes:T(e.strokes,s,s,x,y).map(q=>({...q,w:Math.max(4,q.w*Math.min(1,s*1.1))})),fills:e.fills.map(f=>({...f,d:tr(f.d,s,s,x,y)}))};}
const ICON={

 envelope:()=>({s:[st('M-52,-32 L52,-32 L52,32 L-52,32 Z',INK,6),st('M-52,-32 L0,6 L52,-32',INK,6),st('M0,8 C-14,-2 -14,-14 0,-8 C14,-14 14,-2 0,8',RED,5)],f:[{d:'M-52,-32 L52,-32 L52,32 L-52,32 Z',c:'#fff1c9'},{d:'M0,8 C-14,-2 -14,-14 0,-8 C14,-14 14,-2 0,8 Z',c:'#ee5a4f'}]}),
 sort:()=>({s:[st(ell(-56,-48,14,14,0,2*PI,14),RED,5),st('M-14,-60 L14,-60 L14,-34 L-14,-34 Z',BLUE,5),st('M56,-62 L70,-34 L42,-34 Z',GRN,5),
   st('M-56,-26 L-56,-6 M-52,-12 L-56,-6 L-60,-12',INK,4),st('M0,-26 L0,-6 M4,-12 L0,-6 L-4,-12',INK,4),st('M56,-26 L56,-6 M60,-12 L56,-6 L52,-12',INK,4),
   st('M-78,6 C-74,46 -38,46 -34,6 Z',INK,5),st('M-22,6 C-18,46 18,46 22,6 Z',INK,5),st('M34,6 C38,46 74,46 78,6 Z',INK,5)],
   f:[{d:'M-78,6 C-74,46 -38,46 -34,6 Z',c:'#f6b9b2'},{d:'M-22,6 C-18,46 18,46 22,6 Z',c:'#b9d0ea'},{d:'M34,6 C38,46 74,46 78,6 Z',c:'#bfe3b4'}]}),
 crate:()=>({s:[st('M-56,-18 L56,-18 L56,50 L-56,50 Z',BARK,6),st('M-64,-18 L-64,-42 L64,-42 L64,-18',BARK,6),st('M-56,16 L56,16',BARK,5),st('M-8,-2 L8,-2 L8,12 L-8,12 Z',GOLD,5),st('M-30,-42 L-30,-62 M30,-42 L30,-62',INK,4)],f:[{d:'M-56,-18 L56,-18 L56,50 L-56,50 Z',c:'#d9a971'},{d:'M-64,-18 L-64,-42 L64,-42 L64,-18 Z',c:'#c28f57'}]}),

 mush:()=>({s:[st('M-36,0 C-36,-44 36,-44 36,0 Z',RED,6),st('M-11,0 L-13,34 L13,34 L11,0',INK,6),st(ell(-14,-20,5,5,0,2*PI,8),INK,4),st(ell(14,-24,5,5,0,2*PI,8),INK,4)],f:[{d:'M-36,0 C-36,-44 36,-44 36,0 Z',c:'#ee6a5f'},{d:'M-11,0 L-13,34 L13,34 L11,0 Z',c:'#fff1c9'}]}),
 jar:()=>({s:[st('M-26,-28 L26,-28 L26,40 C26,52 -26,52 -26,40 Z',INK,6),st('M-32,-28 L-32,-46 L32,-46 L32,-28',BARK,6),st('M-14,0 L14,0 M-14,18 L14,18',GOLD,5)],f:[{d:'M-26,-28 L26,-28 L26,40 C26,52 -26,52 -26,40 Z',c:'#ffe3a0'}]}),
 bed:()=>({s:[st('M-62,22 L62,22 M-62,22 L-62,-24 M62,22 L62,-34',BARK,7),st('M-62,2 L62,2',BARK,7),st('M-56,-6 C-56,-26 -30,-26 -30,-6 Z',INK,5)],f:[{d:'M-62,2 L62,2 L62,-6 L-62,-6 Z',c:'#7fcf7a'},{d:'M-56,-6 C-56,-26 -30,-26 -30,-6 Z',c:'#fff4dc'}]}),

 pine:()=>({s:[st('M0,-92 L-42,-32 L-22,-32 L-54,20 L-26,20 L-62,72 L62,72 L26,20 L54,20 L22,-32 L42,-32 Z',GRN,6),st('M0,72 L0,98',BARK,9)],f:[{d:'M0,-92 L-42,-32 L-22,-32 L-54,20 L-26,20 L-62,72 L62,72 L26,20 L54,20 L22,-32 L42,-32 Z',c:'#8fd37f'}]}),
 grass:()=>({s:[st('M0,0 C-4,-20 -10,-30 -16,-36 M0,0 C0,-24 2,-34 4,-44 M0,0 C6,-20 12,-28 20,-32',GRN,5)],f:[]}),

 leaf:()=>({s:[st('M0,0 C-24,-14 -24,-44 0,-60 C24,-44 24,-14 0,0 M0,0 L0,-50',GRN,5)],f:[{d:'M0,0 C-24,-14 -24,-44 0,-60 C24,-44 24,-14 0,0 Z',c:'#a5dc8c'}]})
};
function icon(name,x,y,s=1,sc){const i=ICON[name]();return {strokes:T(i.s,s,s,x,y).map(q=>sc?({...q,c:sc}):q),fills:i.f.map(f=>({...f,d:tr(f.d,s,s,x,y)}))};}
const cat=(...a)=>({strokes:a.flatMap(x=>x.strokes||x),fills:a.flatMap(x=>x.fills||[])});
const txt=(...a)=>({strokes:a.flat(),fills:[]});

/* ---------- build items ---------- */
const ITEMS=[]; // {id,scene,strokes,fills,bob}
function item(id,scene,def,extra={}){ITEMS.push({id,scene,strokes:def.strokes,fills:def.fills||[],...extra});}

// scene 0 — hook + the elf
item('t1',0,txt(lab('t1',540,300,72,INK,'c',8)));
item('t2',0,txt(lab('t2',540,440,72,RED,'c',8)));
item('uline',0,txt([st('M205,478 C300,462 360,496 440,478 C520,460 580,496 660,478 C740,462 800,494 876,476',RED,7)]));
{const e=elf(540,1285,2.3,{}); item('elf',0,e,{bob:true,pivot:[540,1285]});}
item('lblelf',0,txt(lab('elf',190,800,44,BLUE,'c',5),[st('M330,830 C400,860 440,880 468,846',BLUE,6),st('M468,846 L444,844 M468,846 L458,870',BLUE,6)]));
item('ruler',0,txt([st('M820,505 L820,1262',INK,6),st('M796,505 L844,505 M796,1262 L844,1262',INK,6),st('M820,505 L806,534 M820,505 L834,534 M820,1262 L806,1233 M820,1262 L834,1233',INK,6)],lab('cm',945,930,40,INK,'c',5)));
item('ground1',0,cat(txt([st('M120,1274 C300,1266 700,1282 960,1272',BARK,8)]),{strokes:[...icon('grass',180,1272,1).strokes,...icon('grass',250,1276,1.2).strokes,...icon('grass',860,1274,1.2).strokes,...icon('mush',930,1250,.9).strokes,...icon('grass',330,1278,.9).strokes],fills:icon('mush',930,1250,.9).fills}));

// scene 1 — cross-section of the mound
const CX=540,GY=1130,RX=400,RY=640;
const hw=(y,rx,ry)=>rx*Math.sqrt(Math.max(0,1-Math.pow((GY-y)/ry,2)));
item('h2',1,txt(lab('h2',540,270,56,INK,'c',7),[st('M250,308 C400,292 480,322 600,306 C700,294 780,318 830,304',RED,7)]));
item('dome',1,{strokes:[st(ell(CX,GY,RX,RY,PI,2*PI,44),INK,9)],fills:[{d:ell(CX,GY,RX,RY,PI,2*PI,44)+' Z',c:'#f7e7c4'}]});
item('floors',1,txt([st(wob(CX-hw(790,RX,RY),790,CX+hw(790,RX,RY),790,3,9,2),BARK,7),st(wob(CX-hw(950,RX,RY),950,CX+hw(950,RX,RY),950,3,9,3),BARK,7),st(wob(60,GY,1020,GY,3,14,5),BARK,9)]));
{const o=ell(CX,GY,RX,RY,PI+0.46,2*PI-0.46,40), r2=ell(CX,GY,352,592,PI+0.52,2*PI-0.52,40);
 const tufts=[];for(let i=0;i<9;i++){const a=PI+0.5+i*(PI-1.0)/8;const x=CX+RX*Math.cos(a),y=GY+RY*Math.sin(a);tufts.push(st(`M${x-14},${y+4} C${x-14},${y-20} ${x+4},${y-24} ${x+8},${y-6}`,GRN,5));}
 const fl=ell(CX,GY,RX,RY,PI+0.46,2*PI-0.46,40)+' '+tr(ell(CX,GY,352,592,2*PI-0.52,PI+0.52,40),1,1,0,0).replace(/^M/,'L');
 item('roof',1,{strokes:[st(r2,GRN,8),...tufts],fills:[{d:fl+' Z',c:'#8fd37f'}]});}
item('dach',1,cat(txt(lab('dach',830,400,32,GRN,'c',5),[st('M800,424 C780,470 744,500 700,524',GRN,6),st('M700,524 L728,520 M700,524 L714,498',GRN,6)])));
item('strych',1,cat(txt(lab('strych',360,716,40,INK,'l',6)),icon('lantern',690,712,.78)));

{const hole=ell(CX,GY,250,300,PI,0,26);

item('h3',2,txt(lab('h3',540,262,60,INK,'c',7),[st('M330,300 C450,286 560,314 760,298',RED,7)]));
const ROLES=[

 {k:'r3',x:290,y:1330,tun:'#b88100',tf:'#ffd66b',ic:'lantern',ik:'latarnik',c:'#b88100',is:.85},

 item(r.k+'e',2,elf(r.x,r.y,1.05,{tunic:r.tun,tdark:r.tun,tunicF:r.tf}),{bob:true,pivot:[r.x,r.y]});
 item(r.k+'l',2,txt(lab(r.ik,r.x,r.y+92,38,r.c,'c',5),[st(`M${r.x-100},${r.y+112} C${r.x-40},${r.y+122} ${r.x+40},${r.y+104} ${r.x+100},${r.y+114}`,r.c,5)]));

const CY=950,CR=330,ND=[{a:-PI/2,k:'c1',ic:'acorn',ik:1.0,c:GRN},{a:0,k:'c2',ic:'sort',ik:.78,c:BLUE},{a:PI/2,k:'c3',ic:'crate',ik:.95,c:BARK},{a:PI,k:'c4',ic:'heart',ik:.8,c:RED}];
item('h4',3,txt(lab('h4',540,262,56,INK,'c',7),[st('M240,300 C400,286 520,314 700,298 C760,292 800,300 840,296',RED,7)]));
ND.forEach((n,i)=>{const x=540+CR*Math.cos(n.a),y=CY+CR*Math.sin(n.a),R=112;
 const circ=ell(x,y,R,R,0,2*PI,30), below=(i===0)?-1:1;

function arrow(i){const n0=ND[i],a0=n0.a+0.62,a1=ND[(i+1)%4].a+(i===3?2*PI:0)-0.62;const pts=[];const N=14;for(let j=0;j<=N;j++){const a=a0+(a1-a0)*j/N;pts.push([540+CR*Math.cos(a),CY+CR*Math.sin(a)]);}
 const e=pts[N],p=pts[N-1],ang=Math.atan2(e[1]-p[1],e[0]-p[0]);const h=(da)=>`M${e[0].toFixed(1)},${e[1].toFixed(1)} L${(e[0]-34*Math.cos(ang+da)).toFixed(1)},${(e[1]-34*Math.sin(ang+da)).toFixed(1)}`;
 return txt([st(sm(pts),GOLD,10),st(h(.5)+' '+h(-.5),GOLD,10)]);}

 item('fin',4,{strokes:[st(hill,GRN,9),...pines.slice(0,0),...e.strokes,...icon('pine',120,1290,.7).strokes,...icon('pine',960,1290,.7).strokes],fills:[{d:hill+' Z',c:'#a5dc8c'},...e.fills,...icon('pine',120,1290,.7).fills,...icon('pine',960,1290,.7).fills]},{bob:true,pivot:[540,1330]});}

/* ---------- DOM + schedule ---------- */
const scn=[0,1,2,3,4].map(i=>$('sc'+i));
const all=[];
ITEMS.forEach(it=>{
 const w=S.draw[it.id]; if(!w) throw new Error('no window '+it.id);
 it.t0=w[0];it.t1=w[1];
 it.g=el('g',{},scn[it.scene]); it.gf=el('g',{},it.g); it.gi=el('g',{},it.g);
 it.fe=it.fills.map(f=>el('path',{d:f.d,fill:f.c,stroke:'none','fill-opacity':.92},it.gf));
 it.se=it.strokes.map(s=>{const p=el('path',{d:s.d,fill:'none',stroke:s.c,'stroke-width':s.w,'stroke-linecap':'round','stroke-linejoin':'round',pathLength:1,'stroke-dasharray':'1 1','stroke-dashoffset':1},it.gi);return p;});
 const lens=it.se.map(p=>{try{return p.getTotalLength()}catch(e){return 10}}); const LIFT=28; const Wt=lens.reduce((a,b)=>a+b+LIFT,0); const u=(it.t1-it.t0)/Wt; let c=it.t0;
 it.st=it.se.map((p,i)=>{const a=c,d=lens[i]*u;c+=d+LIFT*u;const len=lens[i];const s0=p.getPointAtLength(0),s1=p.getPointAtLength(len);return {p,a,b:a+d,len,s0,s1,col:it.strokes[i].c,it:it};});
 it.st.forEach(s=>all.push(s));
});
all.sort((a,b)=>a.a-b.a);
function tipAt(s,k){const q=s.p.getPointAtLength(s.len*k);return [q.x,q.y];}

/* hand tasks */
const W=S.wipes; const tasks=[{a:-2,b:0,pos:()=>[900,1500],tool:'pen',col:INK}];
all.forEach(s=>tasks.push({a:s.a,b:s.b,pos:k=>tipAt(s,E.clamp(k)),tool:'pen',col:s.col,s0:[s.s0.x,s.s0.y],s1:[s.s1.x,s.s1.y]}));
const eraserPos=k=>[E.lerp(-90,1170,E.ease.io(k)),930+470*Math.sin(k*PI*7)];
W.forEach(w=>tasks.push({a:w[0],b:w[1],pos:eraserPos,tool:'era',col:INK,s0:eraserPos(0),s1:eraserPos(1)}));
const lastB=Math.max(...tasks.map(t=>t.b)); tasks.push({a:lastB+0.4,b:lastB+1.0,pos:k=>[E.lerp(540,1350,E.ease.io(k)),E.lerp(1300,2150,E.ease.io(k))],tool:'pen',col:INK,s0:[540,1300],s1:[1350,2150]});
tasks.sort((a,b)=>a.a-b.a);
const startOf=t=>t.s0||t.pos(0), endOf=t=>t.s1||t.pos(1);
function handPose(t){
 let i=-1; for(let j=0;j<tasks.length;j++){ if(tasks[j].a<=t) i=j; else break; }
 const cur=tasks[Math.max(i,0)];
 if(i>=0 && t<=cur.b){ const k=(t-cur.a)/Math.max(1e-6,cur.b-cur.a); const p=cur.pos(k); return {p,tool:cur.tool,col:cur.col,lift:0}; }
 const nxt=tasks[i+1]; const pe=endOf(cur);
 if(!nxt) return {p:pe,tool:cur.tool==='era'?'pen':cur.tool,col:cur.col,lift:1};
 const ps=startOf(nxt); const gap=nxt.a-cur.b; const dist=Math.hypot(ps[0]-pe[0],ps[1]-pe[1]);
 const trav=Math.min(gap,Math.max(.18,Math.min(.7,dist/2400))); const t0=nxt.a-trav;
 const toolNow=(t>=t0?nxt.tool:(cur.tool==='era'&&t<cur.b?'era':(cur.tool==='era'?'pen':cur.tool)));
 const col=nxt.tool==='pen'&&t>=t0-0.02?nxt.col:cur.col;
 let p,lift;
 if(t<t0){const b=Math.sin(t*5)*4;p=[pe[0]+b,pe[1]+b*.6];lift=cur.tool==='era'?1:E.p(t,cur.b,cur.b+.12,'out');}
 else{const k=E.ease.io((t-t0)/trav);p=[E.lerp(pe[0],ps[0],k),E.lerp(pe[1],ps[1],k)];lift=Math.sin(PI*(t-t0)/trav)*.8+.2;}
 return {p,tool:toolNow,col,lift};
}

/* wipe masks */
function wipe(i,t){const w=W[i];const poly=$('mkp'+i);const k=E.clamp((t-w[0])/(w[1]-w[0]));if(k<=0){poly.setAttribute('points','');return;}
 const ex=eraserPos(k)[0]; const pts=['0,-20'];for(let y=-20;y<=1960;y+=40)pts.push(((ex+10+34*Math.sin(y*.012+i))).toFixed(1)+','+y);pts.push('0,1960');poly.setAttribute('points',pts.join(' '));}

/* fx stars at finale */
const fx=$('fx'); const FXS=[]; {const pos=[[210,760],[880,740],[120,980],[960,1010],[300,640],[780,640],[540,760],[420,300],[700,330]];
 pos.forEach((p,i)=>{const g=el('g',{},fx);const q=icon('star',0,0,.9);q.strokes.forEach(s=>el('path',{d:s.d,fill:'none',stroke:s.c,'stroke-width':6,'stroke-linecap':'round'},g));FXS.push({g,x:p[0],y:p[1],i});});}

const hand=$('hand'),hm=$('hmain'),hsh=$('hshadow'),pen=$('pen'),era=$('era'),pcol=$('pcol'),cap=$('cap'); // pen/era live inside <defs>/<use>; update via the source nodes
const popFx=(t,t1)=>E.p(t,t1,t1+.45,'back');

function update(t){
 // wipes
 [0,1,2,3].forEach(i=>wipe(i,t));
 // items
 for(const it of ITEMS){
  const f=E.p(t,it.t1+0.02,it.t1+.5,'out');
  it.gf.setAttribute('opacity',f.toFixed(3));
  for(const s of it.st){ const k=E.clamp((t-s.a)/Math.max(1e-6,s.b-s.a)); const p=s.p;
   if(k<=0){p.setAttribute('display','none');} else {p.removeAttribute('display');p.setAttribute('stroke-dashoffset',(1-k).toFixed(4));} }
  if(it.bob){const k=E.clamp((t-it.t1)/1.0);const b=Math.sin((t-it.t1)*2.6)*5*k, sq=1+Math.sin((t-it.t1)*2.6)*.012*k;
   it.g.setAttribute('transform',`translate(${it.pivot[0]},${it.pivot[1]}) scale(1,${sq.toFixed(4)}) translate(${-it.pivot[0]},${(-it.pivot[1]+ -b).toFixed(2)})`);}
 }
 // hand
 const h=handPose(t);
 hand.setAttribute('transform',`translate(${h.p[0].toFixed(1)} ${h.p[1].toFixed(1)}) scale(${(1+.05*h.lift).toFixed(3)})`);
 hsh.setAttribute('transform',`translate(${(8+22*h.lift).toFixed(1)} ${(12+26*h.lift).toFixed(1)})`);
 pcol.setAttribute('fill',h.col); pen.setAttribute('display',h.tool==='pen'?'':'none'); era.setAttribute('display',h.tool==='era'?'':'none');
 hand.setAttribute('opacity',(t>S.duration-0.05)?0:1);
 // finale sparkles
 const fin=ITEMS.find(i=>i.id==='fin');
 FXS.forEach(o=>{const k=E.p(t,fin.t1+0.15+o.i*0.05,fin.t1+0.7+o.i*0.05,'back');const tw=.85+.25*Math.sin(t*5+o.i*1.7);const sc=k*tw;
  o.g.setAttribute('transform',`translate(${o.x},${o.y}) rotate(${(t*40+o.i*30).toFixed(1)}) scale(${sc.toFixed(3)})`);o.g.setAttribute('opacity',k>0?1:0);});
 E.captions(cap,t);
}
E.start(update);
