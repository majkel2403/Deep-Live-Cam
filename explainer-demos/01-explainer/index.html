<!doctype html><html lang="pl"><head><meta charset="utf-8"><title>Elfikopki — film wyjaśniający</title>
<link rel="stylesheet" href="../tools/base.css">
<style>
:root{--accent:#ffc94d}
.sc{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden}
.sc svg{position:absolute;left:0;top:0}
.big{position:absolute;left:0;right:0;text-align:center;font-weight:900;color:#fff4dc;line-height:1.05;text-shadow:0 6px 0 rgba(0,0,0,.28)}
.w{display:inline-block;margin:0 .13em;will-change:transform}
.stamp{position:absolute;left:50%;top:430px;margin-left:-300px;width:600px;text-align:center;font-weight:900;font-size:150px;color:#ff5a4d;border:14px solid #ff5a4d;border-radius:22px;background:rgba(14,26,43,.55);letter-spacing:6px;line-height:1.15}
.cta{position:absolute;left:50%;width:760px;margin-left:-380px;text-align:center;font-weight:900;font-size:66px;white-space:nowrap;color:#13342a;background:#ffc94d;border-radius:70px;padding:30px 0;box-shadow:0 12px 0 #c98a1a,0 24px 50px rgba(0,0,0,.35)}
#bar{position:absolute;left:0;top:0;height:12px;background:#ffc94d;z-index:60}
#cap{z-index:60}
</style></head><body>
<div id="stage">
 <svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1220"/><stop offset=".6" stop-color="#0e1a2b"/><stop offset="1" stop-color="#13342a"/></linearGradient>
  <linearGradient id="gDusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1626"/><stop offset="1" stop-color="#23415e"/></linearGradient>
  <linearGradient id="gDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#13342a"/><stop offset="1" stop-color="#1f5a43"/></linearGradient>
  <linearGradient id="gIn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1e12"/><stop offset="1" stop-color="#4b3220"/></linearGradient>
  <linearGradient id="gDawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb35c"/><stop offset=".45" stop-color="#ffe3a3"/><stop offset="1" stop-color="#9ad47f"/></linearGradient>
  <radialGradient id="rGold"><stop offset="0" stop-color="#ffd86a" stop-opacity=".95"/><stop offset="1" stop-color="#ffc94d" stop-opacity="0"/></radialGradient>
  <radialGradient id="rCream"><stop offset="0" stop-color="#fff4dc" stop-opacity=".9"/><stop offset="1" stop-color="#fff4dc" stop-opacity="0"/></radialGradient>
  <radialGradient id="rGreen"><stop offset="0" stop-color="#6bbf59" stop-opacity=".55"/><stop offset="1" stop-color="#6bbf59" stop-opacity="0"/></radialGradient>
 </defs></svg>
 <div id="root"></div>
 <div id="bar"></div>
 <div id="cap"></div>
</div>
<script src="script.js"></script><script src="timing.js"></script><script src="../tools/engine.js"></script>
<script>
if(location.search.includes('render'))document.body.classList.add('render');
const E=Engine, NS='http://www.w3.org/2000/svg';
const C={forest:'#13342a',forest2:'#1f5a43',moss:'#6bbf59',red:'#e8453c',gold:'#ffc94d',bark:'#7a4e2d',cream:'#fff4dc',night:'#0e1a2b'};
const cl=E.clamp, P=E.p, R=E.rnd, lerp=E.lerp;
function mk(tag,at,par){const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(par)par.appendChild(e);return e}
function G(par,inner){const g=mk('g',{},par);if(inner)g.innerHTML=inner;return g}
function put(g,x,y,s=1,r=0,o=1){g.setAttribute('transform',`translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${r.toFixed(2)}) scale(${s<0?0.0001:s.toFixed(4)})`);g.setAttribute('opacity',cl(o).toFixed(3))}
function hx(c){return [1,3,5].map(i=>parseInt(c.substr(i,2),16))}
function mix(a,b,k){const A=hx(a),B=hx(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*k).toString(16).padStart(2,'0')).join('')}
function div(par,cls,css,html){const d=document.createElement('div');d.className=cls||'';if(css)d.style.cssText=css;if(html!=null)d.innerHTML=html;par.appendChild(d);return d}
function words(par,txt,cls,css){const d=div(par,'big '+(cls||''),css||'');const sp=txt.split(' ').map(w=>{const s=document.createElement('span');s.className='w';s.textContent=w;d.appendChild(s);return s});return {d,sp}}
function popWords(o,t,t0,gap,dur,from=40){o.sp.forEach((s,i)=>{const k=P(t,t0+i*gap,t0+i*gap+dur,'back');s.style.opacity=cl(k*2);s.style.transform=`translateY(${(1-k)*from}px) scale(${.6+.4*k})`})}
// ---------- art ----------
function elfSVG(o={}){const tun=o.tunic||'#2f8f4e',cap=o.cap||C.red;
 return `<ellipse cx="-20" cy="-6" rx="22" ry="12" fill="#5b3a22"/><ellipse cx="20" cy="-6" rx="22" ry="12" fill="#5b3a22"/>
 <rect x="-34" y="-96" width="68" height="86" rx="26" fill="${tun}"/><rect x="-34" y="-56" width="68" height="11" fill="#5b3a22"/><rect x="-8" y="-59" width="16" height="17" rx="3" fill="${C.gold}"/>
 <ellipse cx="-42" cy="-66" rx="11" ry="18" fill="#ffdcb8" transform="rotate(16 -42 -66)"/><ellipse cx="42" cy="-66" rx="11" ry="18" fill="#ffdcb8" transform="rotate(-16 42 -66)"/>
 <polygon points="-36,-130 -74,-150 -36,-108" fill="#ffdcb8"/><polygon points="36,-130 74,-150 36,-108" fill="#ffdcb8"/>
 <circle cx="0" cy="-128" r="40" fill="#ffdcb8"/>
 <path d="M-43,-134 C-42,-192 14,-210 60,-180 C32,-178 28,-154 43,-134 Z" fill="${cap}"/><rect x="-45" y="-141" width="90" height="15" rx="7" fill="${C.cream}"/>
 <path d="M52,-178 q24,-32 44,-26 q-10,28 -44,26z" fill="${C.gold}"/>
 <circle cx="-15" cy="-124" r="5.5" fill="#2a1a12"/><circle cx="15" cy="-124" r="5.5" fill="#2a1a12"/><circle cx="-13" cy="-126" r="1.8" fill="#fff"/><circle cx="17" cy="-126" r="1.8" fill="#fff"/>
 <ellipse cx="-27" cy="-110" rx="8" ry="5" fill="#ff8f80" opacity=".65"/><ellipse cx="27" cy="-110" rx="8" ry="5" fill="#ff8f80" opacity=".65"/>
 <path d="M-12,-109 Q0,-96 12,-109" stroke="#7a3b2a" stroke-width="3.5" fill="none" stroke-linecap="round"/>`}
const acorn=(d=0)=>`<ellipse cx="0" cy="5" rx="14" ry="18" fill="${mix('#b9803c','#6f6f5a',d)}"/><path d="M-17,-3 Q0,-26 17,-3 Z" fill="${mix('#7a4e2d','#4e5a48',d)}"/><rect x="-2" y="-24" width="4" height="8" fill="${mix('#7a4e2d','#4e5a48',d)}"/>`;
const berry=(d=0)=>`<circle r="16" fill="${mix('#e8453c','#6b5a68',d)}"/><circle cx="-5" cy="-6" r="4" fill="#fff" opacity="${.5*(1-d)}"/><path d="M0,-16 q10,-10 18,-4 q-8,10 -18,4z" fill="${mix('#6bbf59','#56604a',d)}"/>`;
const shroom=(d=0)=>`<rect x="-7" y="0" width="14" height="20" rx="5" fill="${mix('#fff4dc','#8a8a78',d)}"/><path d="M-22,2 A22,20 0 0 1 22,2 Z" fill="${mix('#c8643c','#665a50',d)}"/><circle cx="-8" cy="-8" r="3.5" fill="#fff" opacity="${.9*(1-d)}"/><circle cx="8" cy="-6" r="3" fill="#fff" opacity="${.9*(1-d)}"/>`;
const ITEM=[acorn,berry,shroom];
const logoSVG=`<rect x="-9" y="-6" width="18" height="30" rx="7" fill="${C.cream}"/><path d="M-38,0 A38,34 0 0 1 38,0 Z" fill="${C.red}"/><circle cx="-14" cy="-14" r="6" fill="#fff"/><circle cx="12" cy="-20" r="5" fill="#fff"/><circle cx="22" cy="-8" r="3.5" fill="#fff"/>`;
function pine(x,y,s,col){return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-14" y="-40" width="28" height="60" fill="${col}"/><polygon points="-90,-30 0,-210 90,-30" fill="${col}"/><polygon points="-76,-120 0,-290 76,-120" fill="${col}"/><polygon points="-56,-210 0,-350 56,-210" fill="${col}"/></g>`}
function oak(x,y,s,trunk,leaf){return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-34,0 L-22,-260 L22,-260 L34,0 Z" fill="${trunk}"/><circle cx="-90" cy="-300" r="110" fill="${leaf}"/><circle cx="90" cy="-310" r="115" fill="${leaf}"/><circle cx="0" cy="-390" r="130" fill="${leaf}"/><circle cx="-10" cy="-290" r="120" fill="${mix(leaf,'#000000',.12)}"/></g>`}
function moundSVG(o={}){const lit=o.lit??1;
 return `<path d="M-390,0 C-390,-150 -250,-280 0,-280 C250,-280 390,-150 390,0 Z" fill="#2c7a4e"/>
 <path d="M-390,0 C-390,-150 -250,-280 0,-280 C250,-280 390,-150 390,0 Z" fill="none" stroke="#134a30" stroke-width="10"/>
 <path d="M-300,-150 C-260,-230 -150,-270 0,-272 C150,-270 260,-230 300,-150 C200,-190 -200,-190 -300,-150 Z" fill="${C.moss}" opacity=".9"/>
 <g fill="#134a30" opacity=".35"><circle cx="-200" cy="-40" r="14"/><circle cx="210" cy="-60" r="18"/><circle cx="-120" cy="-90" r="10"/><circle cx="150" cy="-20" r="10"/><circle cx="260" cy="-120" r="9"/></g>
 <circle cx="-175" cy="-120" r="${52*lit}" fill="url(#rGold)"/><circle cx="175" cy="-120" r="${52*lit}" fill="url(#rGold)"/>
 <circle cx="-175" cy="-120" r="30" fill="${mix('#2a2a22',C.gold,lit)}" stroke="#5b3a22" stroke-width="8"/><circle cx="175" cy="-120" r="30" fill="${mix('#2a2a22',C.gold,lit)}" stroke="#5b3a22" stroke-width="8"/>
 <ellipse cx="0" cy="-60" rx="${95*lit+20}" ry="${110*lit+30}" fill="url(#rGold)" opacity="${lit}"/>
 <path d="M-52,0 L-52,-70 A52,52 0 0 1 52,-70 L52,0 Z" fill="${mix('#2a1c10',C.gold,lit*.85)}" stroke="#5b3a22" stroke-width="10"/>
 <rect x="-130" y="-300" width="36" height="70" rx="6" fill="#7a4e2d" transform="rotate(8 -112 -300)"/>
 <g transform="translate(300,-4)">${'<g transform="scale(.6)">'+logoSVG+'</g>'}</g><g transform="translate(-320,-4) scale(.45)">${logoSVG}</g>
 <path d="M-390,0 H390" stroke="#0e2a1e" stroke-width="12"/>`}
function grass(x,y,s){return `<g transform="translate(${x} ${y}) scale(${s})" fill="${C.moss}"><path d="M-30,0 Q-26,-40 -14,-56 Q-14,-20 -6,0Z"/><path d="M-8,0 Q-4,-60 8,-84 Q10,-30 12,0Z"/><path d="M12,0 Q20,-40 34,-52 Q28,-18 28,0Z"/></g>`}
function stepper(svg,active){const g=G(svg);for(let i=0;i<3;i++){const x=420+i*120;if(i<2)mk('rect',{x:x+24,y:104,width:72,height:8,fill:'rgba(255,244,220,.25)',rx:4},g);
 mk('circle',{cx:x,cy:108,r:24,fill:i<=active?C.gold:'rgba(255,244,220,.18)'},g);const t=mk('text',{x,y:120,'text-anchor':'middle','font-size':32,'font-weight':900,fill:i<=active?C.forest:C.cream,'font-family':'Inter'},g);t.textContent=i+1}return g}
function badge(par,num,l1,l2,col){const d=div(par,'',`position:absolute;left:70px;top:190px;width:940px;height:240px`);
 const n=div(d,'',`position:absolute;left:0;top:30px;width:170px;height:170px;border-radius:50%;background:${col};color:${C.forest};font-weight:900;font-size:120px;line-height:170px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.25)`,num);
 const tx=div(d,'big',`position:absolute;left:200px;top:${l2?18:62}px;text-align:left;font-size:${l2?96:128}px;white-space:nowrap`,l2?`${l1}<br>${l2}`:l1);return {d,n,tx}}
const sceneIn=(el,t,a,cx,cy)=>{const r=P(t,a,a+.8,'io')*2300;el.style.clipPath=`circle(${r.toFixed(1)}px at ${cx}px ${cy}px)`};
// ---------- scenes ----------
const root=document.getElementById('root');
const ST=[0,6.2,12.8,19.2,26.0,32.2,39.2,46.6], ORIG=[[540,960],[540,700],[540,1000],[300,1100],[900,1100],[540,900],[200,1200],[540,1000]];
const scenes=[];
function newScene(){const s=div(root,'sc');const svg=mk('svg',{width:1080,height:1920,viewBox:'0 0 1080 1920'});s.appendChild(svg);return {s,svg}}

// S1 — problem: night forest, lamps go out, food spoils
(()=>{const {s,svg}=newScene();mk('rect',{width:1080,height:1920,fill:'url(#gNight)'},svg);
 const stars=[...Array(40)].map((_,i)=>mk('circle',{cx:R(i)*1080,cy:R(i+50)*1000,r:1.5+R(i+9)*2.5,fill:C.cream},svg));
 const moon=G(svg,`<circle r="200" fill="url(#rCream)" opacity=".35"/><circle r="74" fill="${C.cream}"/><circle cx="-22" cy="-14" r="12" fill="#e6d9b8"/><circle cx="24" cy="22" r="9" fill="#e6d9b8"/><circle cx="14" cy="-30" r="6" fill="#e6d9b8"/>`);put(moon,850,470);
 G(svg,[0,1,2,3,4,5,6,7].map(i=>pine(60+i*150+R(i)*40,1300,.5+R(i+3)*.3,'#0a1f1a')).join(''));
 mk('path',{d:'M0,1300 Q300,1240 560,1290 T1080,1270 V1920 H0Z',fill:'#0f2a20'},svg);
 const fronts=G(svg,pine(40,1420,.8,'#07140e')+pine(1050,1440,.85,'#07140e'));
 const lampPos=[[170,760],[430,640],[700,880],[900,720],[620,560]], off=[1.9,2.7,3.4,4.1,4.8];
 const lamps=lampPos.map(()=>G(svg));
 const items=[...Array(14)].map((_,i)=>({g:G(svg),x:70+(i%7)*150+R(i)*40,y:1340+Math.floor(i/7)*150+R(i+4)*50,ty:i%3,t0:2.0+i*.14}));
 const stink=[...Array(8)].map(()=>mk('path',{fill:'none',stroke:'#9bb07a','stroke-width':4,'stroke-linecap':'round'},svg));
 const ttl=words(s,'Co dzieje się w lesie, gdy nikt nie pilnuje?','', 'top:150px;font-size:84px;padding:0 50px');
 const stamp=div(s,'stamp','','CHAOS');
 scenes.push(t=>{stars.forEach((e,i)=>e.setAttribute('opacity',(.35+.65*Math.abs(Math.sin(t*1.3+i*2.1))).toFixed(2)));
  put(moon,850,470+Math.sin(t*.5)*6,1,0,1);
  fronts.setAttribute('transform',`translate(${Math.sin(t*.7)*4} 0)`);
  lamps.forEach((g,i)=>{const [x,y]=lampPos[i],o=off[i];let b=1;if(t>o)b=0;else if(t>o-.5)b=.5+.5*Math.sin(t*44);
   const bx=x+Math.sin(t*1.1+i)*22,by=y+Math.cos(t*1.7+i*2)*16;
   g.innerHTML=b>0?`<circle cx="${bx}" cy="${by}" r="${130*b}" fill="url(#rGold)"/><ellipse cx="${bx-12}" cy="${by-6}" rx="10" ry="6" fill="#fff4dc" opacity=".7"/><ellipse cx="${bx+12}" cy="${by-6}" rx="10" ry="6" fill="#fff4dc" opacity=".7"/><circle cx="${bx}" cy="${by}" r="11" fill="#fff0a0"/>`:`<circle cx="${bx}" cy="${by}" r="8" fill="#47525c"/>`});
  const gone=lampPos.filter((_,i)=>t>off[i]).length;
  items.forEach(it=>{const d=cl((t-it.t0)/1.6);it.g.setAttribute('transform',`translate(${it.x} ${it.y}) rotate(${(R(it.ty+it.x)-.5)*50})`);it.g.innerHTML=ITEM[it.ty](d)});
  stink.forEach((e,i)=>{const it=items[Math.min(13,i*2)];const d=cl((t-it.t0-1)/1);const x=it.x,y=it.y-30,ph=t*3+i;e.setAttribute('d',`M${x},${y} q10,-18 0,-34 q-10,-16 0,-34`);e.setAttribute('transform',`translate(${Math.sin(ph)*6} ${-((t*40+i*20)%60)})`);e.setAttribute('opacity',(d*.8*(1-((t*40+i*20)%60)/60)).toFixed(2))});
  popWords(ttl,t,.3,.2,.45);
  const k=P(t,3.2,3.5,'out');const sh=t>3.5&&t<4.2?Math.sin(t*60)*(4.2-t)*6:0;
  stamp.style.opacity=cl(k*3);stamp.style.transform=`scale(${2.6-1.6*k}) rotate(${-8+sh}deg)`;
  const flick=t>4.9?1:0;});})();

// S2 — stakes: the pantry empties under snow
(()=>{const {s,svg}=newScene();mk('rect',{width:1080,height:1920,fill:'url(#gDusk)'},svg);
 const flakes=[...Array(70)].map((_,i)=>({e:mk('circle',{fill:'#fff'},svg),x:R(i)*1080,y:R(i+9)*1920,sp:70+R(i+3)*110,r:3+R(i+5)*6,ph:R(i+7)*6}));
 G(svg,`<rect x="120" y="640" width="840" height="800" rx="18" fill="#5b3a22"/><rect x="150" y="670" width="780" height="740" rx="8" fill="#2a1c10"/>`);
 [0,1,2].forEach(r=>G(svg,`<rect x="130" y="${880+r*190}" width="820" height="26" rx="6" fill="#7a4e2d"/>`));
 const cols=['#b9803c','#e8453c','#d9c8a0'];
 const jars=[...Array(9)].map((_,i)=>{const r=Math.floor(i/3),c=i%3,x=250+c*290,y=880+r*190;
  const g=G(svg,`<rect x="-62" y="-150" width="124" height="150" rx="22" fill="rgba(255,244,220,.10)"/>`);put(g,x,y);
  const fill=mk('rect',{x:-56,width:112,rx:16,fill:cols[(i+r)%3]},g);
  const lid=mk('rect',{x:-50,y:-166,width:100,height:20,rx:8,fill:'#a07040'},g);mk('rect',{x:-62,y:-150,width:124,height:150,rx:22,fill:'none',stroke:'rgba(255,244,220,.6)','stroke-width':5},g);return {fill,t0:7.3+i*.38}});
 const web=G(svg,`<path d="M150,670 L330,690 M150,670 L190,820 M150,720 Q200,730 230,790 M150,770 Q175,790 190,830" stroke="#fff" stroke-width="3" fill="none" opacity=".5"/>`);
 const pill=div(s,'', 'position:absolute;left:50%;top:170px;margin-left:-290px;width:580px;padding:14px 0;text-align:center;background:#dff0ff;color:#16324a;font-weight:900;font-size:56px;border-radius:60px;box-shadow:0 8px 0 rgba(0,0,0,.3)','❄ Zima idzie');
 const num=div(s,'big','top:310px;font-size:250px;color:#ffc94d','100%');
 const sub=div(s,'big','top:565px;font-size:52px;color:#dff0ff','zapasów na zimę');
 const barBg=div(s,'', 'position:absolute;left:140px;top:1500px;width:800px;height:34px;border-radius:17px;background:rgba(255,255,255,.18)');
 const barFg=div(barBg,'', 'height:100%;border-radius:17px;background:#ffc94d');
 const empty=div(s,'big','top:1280px;font-size:110px;color:#ff5a4d','PUSTO.');
 scenes.push(t=>{flakes.forEach(f=>{const y=(f.y+t*f.sp)%1980-30,x=f.x+Math.sin(t*.8+f.ph)*30;f.e.setAttribute('cx',x);f.e.setAttribute('cy',y);f.e.setAttribute('r',f.r);f.e.setAttribute('opacity',(.55+.35*Math.sin(f.ph+t)).toFixed(2))});
  let sum=0;jars.forEach(j=>{const lv=1-P(t,j.t0,j.t0+1.5,'io');sum+=lv;const h=130*lv;j.fill.setAttribute('y',-10-h);j.fill.setAttribute('height',Math.max(0,h))});
  const v=sum/9;num.textContent=Math.round(v*100)+'%';num.style.color=mix('#ff5a4d','#ffc94d',v);
  const sk=t>11.2?1+.06*Math.sin(t*14):1;num.style.transform=`scale(${sk})`;
  barFg.style.width=(v*100)+'%';barFg.style.background=mix('#ff5a4d','#ffc94d',v);
  const kp=P(t,6.5,7.0,'back');pill.style.opacity=cl(kp*3);pill.style.transform=`translateY(${(1-kp)*-120}px)`;
  const ke=P(t,11.0,11.5,'back');empty.style.opacity=cl(ke*3);empty.style.transform=`scale(${.4+.6*ke}) rotate(${-4}deg)`;
  web.setAttribute('opacity',P(t,10,12,'lin'));});})();

// S3 — solution: Elfikopki arrive
(()=>{const {s,svg}=newScene();mk('rect',{width:1080,height:1920,fill:'url(#gDay)'},svg);
 const rays=G(svg);for(let i=0;i<14;i++)mk('polygon',{points:'0,0 -90,-1500 90,-1500',fill:'rgba(255,230,140,.10)',transform:`rotate(${i*360/14})`},rays);
 const glow=G(svg,`<circle r="520" fill="url(#rGold)" opacity=".55"/>`);put(glow,540,1000);
 const leaves=[...Array(16)].map((_,i)=>({g:G(svg,`<path d="M0,0 q22,-30 44,0 q-22,30 -44,0z" fill="${i%2?C.moss:'#9ad47f'}"/>`),x:R(i)*1080,y:R(i+1)*1920,s:.6+R(i+2)}));
 const elf=G(svg,elfSVG({tunic:'#2f8f4e'}));const shadow=G(svg,`<ellipse rx="150" ry="26" fill="rgba(0,0,0,.28)"/>`);
 const sparks=[...Array(18)].map((_,i)=>G(svg,`<path d="M0,-16 L4,-4 L16,0 L4,4 L0,16 L-4,4 L-16,0 L-4,-4Z" fill="${i%2?C.gold:C.cream}"/>`));
 const logo=G(svg,logoSVG);
 const title=div(s,'big','top:370px;font-size:170px;color:#fff4dc','');const letters='Elfikopki'.split('').map(ch=>{const sp=document.createElement('span');sp.textContent=ch;sp.style.cssText='display:inline-block';title.appendChild(sp);return sp});
 const tag=div(s,'big','top:590px;font-size:62px;color:#ffc94d;letter-spacing:2px','Mały elf. Wielki las.');
 scenes.push(t=>{rays.setAttribute('transform',`translate(540 1000) rotate(${t*6})`);
  leaves.forEach((l,i)=>put(l.g,(l.x+Math.sin(t*.7+i)*50),((l.y+t*60*l.s)%2000)-40,l.s,t*50+i*40,.7));
